name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 6.0.x
      - name: Audit publication inputs
        shell: pwsh
        run: ./tools/Test-Publication.ps1
      - name: Build and test without live VPS credentials
        shell: pwsh
        run: |
          dotnet restore tests/NetUlta.Tests/NetUlta.Tests.csproj --configfile NuGet.Config
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build tests/NetUlta.Tests/NetUlta.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tests/NetUlta.Tests/bin/Release/net6.0-windows/NetUlta.Tests.exe
          exit $LASTEXITCODE
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -I tests/test_awg_setup.py
      - run: python -I tests/test_https_relay.py
      - run: python -I tests/test_gateway_setup.py
      - run: python -I tests/test_sharing.py
      - name: Restricted invitation key against isolated OpenSSH
        run: sudo "$(command -v python)" -I tests/test_shared_ssh.py
